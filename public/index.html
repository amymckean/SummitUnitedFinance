<!doctype html>
<html lang="en" data-org="all"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Org finances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
 :root{--bg:#f4f6f8;--surface:#fff;--text:#16202a;--muted:#5b6570;--border:#dde1e6;--th-bg:#eef1f5;--th-text:#16202a;
  --accent:#334155;--accent2:#334155;--on-accent:#fff;--link:#1d4ed8;--bad:#b42318;--ok:#067647;--warn:#b54708;
  --header-bg:#fff;--header-text:#16202a;--font-head:system-ui,sans-serif;--font-body:system-ui,sans-serif;--head-weight:700;--head-spacing:0}
 *{box-sizing:border-box}
 body{font:16px/1.5 var(--font-body);margin:0;background:var(--bg);color:var(--text)}
 header{background:var(--header-bg);color:var(--header-text);border-bottom:4px solid var(--accent)}
 .brandbar{max-width:1100px;margin:0 auto;padding:18px 16px;display:flex;align-items:center;gap:16px}
 #logo{height:56px;width:auto;display:block}
 .bolt{display:none;height:40px;width:40px;fill:var(--accent)} [data-org=voltage] .bolt{display:block}
 [data-org=voltage] #logo:not([hidden]) ~ .bolt, #logo:not([hidden]) + .bolt{display:none}
 #brandName{font:var(--head-weight) 30px/1.1 var(--font-head);letter-spacing:var(--head-spacing);margin:0;text-transform:none}
 [data-org=voltage] #brandName{font-size:38px;color:var(--accent)}
 #brandTag{color:var(--muted);margin:2px 0 0;font-size:15px}
 main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
 h2{font:var(--head-weight) 24px/1.2 var(--font-head);letter-spacing:var(--head-spacing);margin:32px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--accent2)}
 [data-org=voltage] h2{font-size:28px;color:var(--accent)}
 form,.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
 label{display:inline-block;margin:0 16px 8px 0;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
 input,select{font:inherit;padding:6px 8px;margin-top:2px;display:block;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;color-scheme:light dark}
 [data-org=voltage] input,[data-org=voltage] select{color-scheme:dark}
 button{font:inherit;font-weight:700;padding:9px 20px;border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);cursor:pointer;letter-spacing:.02em}
 button:disabled{opacity:.6;cursor:wait}
 form#f,.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
 form#f label,.filters label{margin:0;display:flex;flex-direction:column;gap:4px}
 .filters{align-items:flex-end}
 form#f input,form#f select,form#f button,.filters select,.filters input{height:40px;margin:0;font-size:15px;padding:0 12px;border-radius:8px;min-width:0}
 form#f input,form#f select,.filters input,.filters select{min-width:150px}
 form#f button{padding:0 24px}
 form#f input,form#f button,.filters input{box-sizing:border-box;line-height:38px;display:block}
 form#f select,.filters select{box-sizing:border-box;line-height:normal;display:block}
 input[type=date]{display:flex;align-items:center}
 input[type=date]::-webkit-datetime-edit,input[type=date]::-webkit-date-and-time-value{line-height:38px;padding:0;margin:0;min-height:0;display:flex;align-items:center;text-align:left}
 input[type=date]::-webkit-datetime-edit-fields-wrapper{padding:0;display:flex;align-items:center}
 select{line-height:normal;padding-top:0;padding-bottom:0}
 .tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
 table{border-collapse:collapse;width:100%;background:var(--surface)}
 th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
 th{background:var(--th-bg);color:var(--th-text);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
 td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
 .bad{color:var(--bad);font-weight:700} .ok{color:var(--ok)} .warn{color:var(--warn);font-weight:700}
 .banner{background:var(--surface);border:1px solid var(--warn);border-left-width:6px;padding:10px 14px;border-radius:8px;margin-bottom:12px}
 .err{background:var(--surface);border:1px solid var(--bad);border-left-width:6px;padding:10px 14px;border-radius:8px;margin-bottom:12px;color:var(--bad)}
 .dl{font-family:var(--font-body);font-size:14px;margin-left:10px;font-weight:400;cursor:pointer;color:var(--link);text-decoration:underline;letter-spacing:0}
 th.sortable{cursor:pointer;user-select:none} th.sortable:hover{text-decoration:underline}
 th[data-dir=asc]::after{content:" \25B2";font-size:10px} th[data-dir=desc]::after{content:" \25BC";font-size:10px}
 tr.detail{display:none} tr.open + tr.detail{display:table-row} tr[style*="none"] + tr.detail{display:none!important}
 tr.detail > td{background:var(--bg);white-space:normal} tr.detail table{width:auto;min-width:560px;margin:6px 0 12px} a.tog{cursor:pointer;text-decoration:none;font-weight:600}
 tr.open > td:first-child a.tog::before{content:"\25BC  "} tr:not(.open) > td:first-child a.tog::before{content:"\25B6  ";font-size:11px}
 details table{margin:6px 0 10px;font-size:13px} summary{cursor:pointer;color:var(--link)}
 #tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px;border-bottom:2px solid var(--accent2)}
 #tabs a{padding:9px 16px;text-decoration:none;color:var(--text);font-weight:600;border-radius:8px 8px 0 0}
 #tabs a.on{background:var(--accent);color:var(--on-accent)} .pane[hidden]{display:none}
 input.bud{width:110px;min-width:0!important;height:32px!important;text-align:right;padding:0 8px!important;font-size:14px!important;display:inline-block!important}
 input.bud.mod{border-color:var(--warn);background:var(--surface);font-weight:700}
 tfoot tr.tot td{font-weight:700;border-top:2px solid var(--accent2);background:var(--th-bg)}
 .note{color:var(--muted);font-size:14px;margin:6px 0 0}
 @media print{
  body,header,form,.tablewrap,table,td,th,.banner{background:#fff!important;color:#000!important}
  th{background:#eee!important;color:#000!important} h2,#brandName{color:#000!important}
  form,.dl,#tabs{display:none} .pane[hidden]{display:block} .tablewrap{border-color:#bbb} td,th{border-color:#ccc!important}
 }
</style></head><body>
<header><div class="brandbar">
 <img id="logo" alt="" hidden>
 <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><polygon points="14,1 4,14 11,14 9,23 20,9 13,9"/></svg>
 <div><h1 id="brandName">Org finances</h1><p id="brandTag">Finance reports</p></div>
</div></header>
<main>
<form id="f">
 <label>Start<input type="date" id="start" required></label>
 <label>End<input type="date" id="end" required></label>
 <label>Org<select id="org"><option>all</option><option>summit</option><option>voltage</option></select></label>
 <button id="go" type="submit">Run reports</button>
</form>
<div id="out"></div>
<script src="brand.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (x) => String(x ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const m = (x) => Number(x).toFixed(2);
const money = (x) => Number(x).toLocaleString("en-US", { style: "currency", currency: "USD" });
const lcls = (s) => s === "Behind" ? "bad" : (s === "Paid in full" ? "ok" : "ok");
const cls = (s) => s === "Past due" ? "bad" : (["Invoice open","Paused"].includes(s) ? "warn" : (s === "Current" ? "ok" : ""));

let LAST = null; const OV = new Map(); let ITEMS = [], ITEM_ID = 0, LAST_CATS = []; // what-if budget edits (OV) and what-if expense line items (ITEMS) made on this page (never saved)
const bkey = (org, cat) => org + "\u0000" + cat;
function withOverrides(r) {
  if (!OV.size && !ITEMS.length) return r;
  const xp = new Map(), extra = new Map();
  for (const it of ITEMS) xp.set(bkey(it.org, it.category), (xp.get(bkey(it.org, it.category)) || 0) + it.amount);
  const known = new Set(r.budget.map((b0) => bkey(b0.org, b0.category)));
  const rows = [...r.budget, ...[...xp.keys()].filter((k) => !known.has(k)).map((k) => { const [org, category] = k.split("\u0000"); return { org, category, budget: null, actual: 0, left: null, pct: null }; })];
  const budget = rows.map((b0) => {
    const o = OV.get(bkey(b0.org, b0.category)), x = xp.get(bkey(b0.org, b0.category)) || 0;
    if (o === undefined && !x) return b0;
    const bud = o === undefined ? b0.budget : o, actual = b0.actual + x;
    if (x) extra.set(b0.org, (extra.get(b0.org) || 0) + x);
    return { ...b0, budget: bud, actual, whatif: x, left: bud === null ? null : bud - actual, pct: bud ? (actual / bud) * 100 : null };
  });
  const board = r.board.map((o) => (extra.has(o.org) ? { ...o, expenses: o.expenses + extra.get(o.org), result: o.result - extra.get(o.org) } : o));
  return { ...r, budget, board };
}
function whatIfPanel(r) {
  const cats = r.budget.filter((b) => !b.whatif || true).map((b) => b.org + "\u0000" + b.category);
  const uniq = [...new Set(cats)]; LAST_CATS = uniq;
  const list = ITEMS.length ? `<table style="margin-top:10px"><tr><th>Org</th><th>Category</th><th>Item</th><th class="n">Amount</th><th></th></tr>${ITEMS.map((it) => `<tr><td>${esc(it.org)}</td><td>${esc(it.category)}</td><td>${esc(it.desc)}</td><td class="n">${m(it.amount)}</td><td><a href="#forecast" class="tog rmItem" data-id="${it.id}">remove</a></td></tr>`).join("")}<tr class="tot"><td colspan="3">Total what-if spending</td><td class="n">${m(ITEMS.reduce((t, x) => t + x.amount, 0))}</td><td></td></tr></table>` : "";
  return `<h2>What if I spend...</h2><div class="card"><div class="filters">
    <label>Category<select id="wiCat">${uniq.map((k, i) => { const [o, c] = k.split("\u0000"); return `<option value="${i}">${esc(o)} - ${esc(c)}</option>`; }).join("")}<option value="__new">New category...</option></select></label>
    <label id="wiNewWrap" hidden>Org<select id="wiNewOrg">${[...new Set(r.budget.map((b) => b.org))].map((o) => `<option>${esc(o)}</option>`).join("")}</select> Name<input id="wiNewCat" type="text" placeholder="Category name"></label>
    <label>Item<input id="wiDesc" type="text" placeholder="e.g. New pitching machine"></label>
    <label>Amount<input id="wiAmt" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" style="width:130px"></label>
    <button id="wiAdd" type="button">Add</button></div>${list}
    <p class="note">Add as many line items as you like. Each one adds to its category's Spent, so Left, % used, the forecast and the revenue projection all update. Nothing is saved; reloading clears them.</p></div>`;
}
function makeSortable(root){
 const key=(c)=>{const s=c.querySelector("summary"),inp=c.querySelector("input");let t=(inp?inp.value:(s?s.textContent:c.textContent)).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(t)||/^(Due by|Grace until) /.test(t))return[1,t];
  const n=parseFloat(t.replace(/[$,]/g,""));return/^[$-]?[\d,]*\.?\d/.test(t)&&!isNaN(n)?[0,n]:[1,t.toLowerCase()]};
 root.querySelectorAll("table").forEach((tb)=>{
  if(tb.closest("details")||!tb.rows.length||!tb.rows[0].querySelector("th"))return;
  tb.rows[0].querySelectorAll("th").forEach((th,i)=>{
   th.classList.add("sortable");
   th.addEventListener("click",()=>{
    const dir=th.dataset.dir==="asc"?"desc":"asc";
    tb.querySelectorAll("th").forEach((h)=>{delete h.dataset.dir});th.dataset.dir=dir;
    const body=tb.tBodies[0],groups=[];
    [...tb.tBodies[0].rows].slice(1).forEach((r)=>{r.classList.contains("detail")?groups[groups.length-1].push(r):groups.push([r])});
    groups.sort((a,b)=>{const x=key(a[0].cells[i]),y=key(b[0].cells[i]);
     const r=x[0]!==y[0]?x[0]-y[0]:(x[1]<y[1]?-1:x[1]>y[1]?1:0);return dir==="asc"?r:-r});
    groups.forEach((g)=>g.forEach((r)=>body.appendChild(r)));
    applyCaps();
   });
  });
 });
}

function applyBrand(key) {
  const k = BRANDS[key] ? key : "all";
  const b = BRANDS[k], root = document.documentElement;
  root.dataset.org = k;
  for (const [name, val] of Object.entries(b.vars)) root.style.setProperty("--" + name, val);
  $("#brandName").textContent = b.name;
  $("#brandTag").textContent = b.tagline;
  document.title = b.title;
  const logo = $("#logo");
  logo.onerror = () => { logo.hidden = true; };
  if (b.logo) { logo.src = b.logo; logo.hidden = false; } else { logo.hidden = true; logo.removeAttribute("src"); }
}

const today = new Date(); const iso = (d) => d.toISOString().slice(0, 10);
$("#start").value = "2026-06-01"; // whole season by default
$("#end").value = "2027-07-31";
const wanted = new URLSearchParams(location.search).get("org");
if (wanted && BRANDS[wanted]) $("#org").value = wanted;
applyBrand($("#org").value);
$("#org").addEventListener("change", () => { applyBrand($("#org").value); $("#f").requestSubmit(); });
$("#start").addEventListener("change", () => $("#f").requestSubmit());
$("#end").addEventListener("change", () => $("#f").requestSubmit());

function csvHref(headers, rows) {
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const text = [headers, ...rows].map((r) => r.map(q).join(",")).join("\n");
  return URL.createObjectURL(new Blob([text], { type: "text/csv" }));
}
function dl(name, headers, rows) {
  return `<a class="dl" download="${name}" href="${csvHref(headers, rows)}">Download CSV</a>`;
}
function playerDl(x) {
  const lines = [["Player", x.player, "", "", ""], ["Org / team", `${x.org} / ${x.team}`, "", "", ""], ["Parent", x.payer, "", "", ""],
    ["Status", x.status, "", "", x.note], ["Plan total", "", "", m(x.plan_total), ""], ["Paid", "", "", m(x.paid), ""], ["Remaining", "", "", m(x.remaining), ""],
    ...x.schedule.map((y) => ["Schedule", y.item, y.due, m(y.amount), y.status]),
    ...x.history.map((h) => ["Payment", h.id, h.date, m(h.gross), h.kind + (h.refunded ? ` (refunded ${m(h.refunded)})` : "")])];
  return `<a class="dl" download="${esc(x.player.replace(/\s+/g, "_"))}.csv" href="${csvHref(["Section","Item","Date","Amount","Status / counts as"], lines)}">Download this player (CSV)</a>`;
}
let CAPN = 0; const EXPANDED = new Set(); // long tables show their first rows, with a link to see them all
function table(head, rows, foot, cap) {
  const cid = cap ? CAPN++ : -1;
  return `<div class="tablewrap"><table${cap ? ` data-cap="${cap}" data-cid="${cid}"` : ""}><tr>${head.map(([h, n]) => `<th class="${n ? "n" : ""}">${h}</th>`).join("")}</tr>${rows.join("")}${foot && foot.length ? `<tfoot>${foot.join("")}</tfoot>` : ""}</table></div>`
    + (cap && rows.length > cap ? `<p class="morebar"><a href="#" class="tog showmore" data-cid="${cid}"></a></p>` : "");
}
function applyCaps() {
  document.querySelectorAll("table[data-cap]").forEach((tb) => {
    const n = Number(tb.dataset.cap), open = EXPANDED.has(tb.dataset.cid), rows = [...tb.tBodies[0].rows].slice(1);
    rows.forEach((r, i) => { r.hidden = !open && i >= n; });
    const link = document.querySelector(`.showmore[data-cid="${tb.dataset.cid}"]`);
    if (link) link.textContent = open ? `Show only the first ${n}` : `Show all ${rows.length}`;
  });
}
const tsum = (arr, f) => arr.reduce((t, x) => t + (Number(f(x)) || 0), 0);
// a totals row: numbers become right-aligned money cells, strings stay text
const trow = (cells) => `<tr class="tot">${cells.map((c) => (typeof c === "number" ? `<td class="n">${m(c)}</td>` : c && c.cnt !== undefined ? `<td class="n">${c.cnt}</td>` : `<td>${c}</td>`)).join("")}</tr>`;

// Budget vs actual rows. editable = budget boxes you can type in (Forecast tab); otherwise plain numbers.
function budgetTable(r, editable) {
  const orgs = [...new Set(r.budget.map((b) => b.org))];
  const rows = r.budget.map((b) => `<tr><td>${esc(b.org)}</td><td>${esc(b.category)}</td><td class="n">${editable
    ? `<input class="bud${OV.has(bkey(b.org, b.category)) ? " mod" : ""}" type="number" min="0" step="0.01" data-k="b" data-o="${esc(b.org)}" data-c="${esc(b.category)}" value="${b.budget === null ? "" : b.budget}" placeholder="none" title="Type a different budget to see the effect. Not saved.">`
    : b.budget === null ? "no budget" : m(b.budget)}</td><td class="n">${m(b.actual)}</td><td class="n ${b.left !== null && b.left < 0 ? "bad" : ""}">${b.left === null ? "" : m(b.left)}</td><td class="n">${b.pct === null ? "" : b.pct.toFixed(0) + "%"}</td>${editable ? `<td class="n">${b.whatif ? m(b.whatif) : ""}</td>` : ""}</tr>`);
  const tot = (label, list) => { const bud = tsum(list, (b) => b.budget), act = tsum(list, (b) => b.actual);
    return `<tr class="tot"><td>${label}</td><td></td><td class="n">${m(bud)}</td><td class="n">${m(act)}</td><td class="n ${bud - act < 0 ? "bad" : ""}">${m(bud - act)}</td><td class="n">${bud ? ((act / bud) * 100).toFixed(0) + "%" : ""}</td>${editable ? `<td class="n">${tsum(list, (b) => b.whatif) ? m(tsum(list, (b) => b.whatif)) : ""}</td>` : ""}</tr>`; };
  const foot = orgs.map((o) => tot(esc(o) + " total", r.budget.filter((b) => b.org === o)));
  if (orgs.length > 1) foot.push(tot("All orgs", r.budget));
  return table([["Org"], ["Category"], ["Season budget", 1], ["Spent (these dates)", 1], ["Left", 1], ["% used", 1], ...(editable ? [["What-if added", 1]] : [])], rows, foot);
}


// ---- Revenue projection to a chosen date: what is collected, plus what is scheduled to arrive by then ----
let PROJ_DATE = "";
function projection(r, date) {
  const key = (o, p) => o + "|" + String(p).trim().toLowerCase();
  const subbed = new Set((r.status || []).filter((x) => x.status !== "Canceled").map((x) => key(x.org, x.player)));
  const orgs = [...new Set(r.ledger.map((x) => x.org))].sort();
  return orgs.map((org) => {
    const b = r.board.find((x) => x.org === org) || { gross: 0, fees: 0, net_income: 0, pending: 0 };
    const rate = b.gross > 0 ? b.fees / b.gross : 0;
    let sub = 0, other = 0, late = 0, nSub = 0, nOther = 0;
    const subPlayers = new Set(), otherPlayers = new Set();
    for (const x of r.ledger.filter((y) => y.org === org)) {
      const isSub = subbed.has(key(x.org, x.player));
      for (const it of x.schedule || []) {
        if (it.status === "Paid") continue;
        const amt = Number(it.amount);
        if (it.status === "Overdue" || it.status === "MISSING") { if (!it.due || it.due <= date) late += amt; continue; }
        if (!it.due || it.due > date) continue;
        if (isSub) { sub += amt; nSub++; subPlayers.add(x.player); } else { other += amt; nOther++; otherPlayers.add(x.player); }
      }
    }
    const net = (g) => g * (1 - rate);
    return { org, spent: b.expenses || 0, collected: b.net_income, sub: net(sub), other: net(other), late: net(late), nSub, nOther, pSub: subPlayers.size, pOther: otherPlayers.size, rate,
      sure: b.net_income + net(sub), likely: b.net_income + net(sub) + net(other), best: b.net_income + net(sub) + net(other) + net(late) };
  });
}
function projectionHtml(r) {
  const date = PROJ_DATE || (r.range && r.range.end) || r.as_of;
  const rows = projection(r, date), all = (f) => rows.reduce((t, x) => t + f(x), 0);
  const tr = (label, f, bold) => `<tr><td>${bold ? `<b>${label}</b>` : label}</td>${rows.map((x) => `<td class="n">${bold ? `<b>${m(f(x))}</b>` : m(f(x))}</td>`).join("")}<td class="n">${bold ? `<b>${m(all(f))}</b>` : m(all(f))}</td></tr>`;
  return `<h2>Revenue projection</h2><div class="card"><label>Project revenue through <input type="date" id="projDate" value="${esc(date)}" style="width:auto;height:40px;margin-left:6px"></label>
    <table style="margin-top:12px"><tr><th></th>${rows.map((x) => `<th class="n">${esc(x.org)}</th>`).join("")}<th class="n">Total</th></tr>
    ${tr("Collected so far (net of fees, includes pending)", (x) => x.collected)}
    ${tr("+ Monthly payments already on a subscription", (x) => x.sub)}
    ${tr("Projected: collected + subscriptions", (x) => x.sure, true)}
    ${tr("+ Installments from players not on a subscription", (x) => x.other)}
    ${tr("Projected: if everyone pays on schedule", (x) => x.likely, true)}
    ${tr("+ Past-due amounts, if they are collected", (x) => x.late)}
    ${tr("Projected: best case", (x) => x.best, true)}
    <tr><td colspan="${rows.length + 2}" style="padding-top:14px"><b>After expenses so far</b></td></tr>
    ${tr("Expenses so far (these dates, plus any what-if)", (x) => x.spent)}
    ${tr("Left after expenses: collected + subscriptions", (x) => x.sure - x.spent, true)}
    ${tr("Left after expenses: if everyone pays on schedule", (x) => x.likely - x.spent, true)}
    ${tr("Left after expenses: best case", (x) => x.best - x.spent, true)}</table>

    }
  }

  // ---- Forecast: what is still scheduled to come in, against what the budgets allow to go out ----
  {
    const orgs = [...new Set(r.ledger.map((x) => x.org))].sort();
    const monthOf = (d) => (d ? d.slice(0, 7) : "");
    const thisMonth = (r.as_of || "").slice(0, 7);
    const buckets = new Map(); // month label -> {org: amount}
    const summary = [];
    for (const org of orgs) {
      const b = r.board.find((x) => x.org === org) || { gross: 0, fees: 0, refunds: 0, net_income: 0 };
      const feeRate = b.gross > 0 ? b.fees / b.gross : 0;
      let owed = 0;
      for (const x of r.ledger.filter((y) => y.org === org)) {
        for (const it of x.schedule || []) {
          if (it.status === "Paid") continue;
          const mo = it.due && monthOf(it.due) >= thisMonth ? monthOf(it.due) : "Overdue / past";
          if (!buckets.has(mo)) buckets.set(mo, {});
          buckets.get(mo)[org] = (buckets.get(mo)[org] || 0) + Number(it.amount);
          owed += Number(it.amount);
        }
      }
      const toCollect = owed * (1 - feeRate);
      const bud = r.bank_loaded ? r.budget.filter((x) => x.org === org) : [];
      const spent = bud.reduce((t, x) => t + x.actual, 0);
      const isBuf = (x) => /contingency/i.test(x.category); // a cushion in the budget, not planned spending
      const projExp = bud.reduce((t, x) => t + (isBuf(x) ? x.actual : Math.max(x.budget ?? 0, x.actual)), 0);
      const buffer = bud.filter(isBuf).reduce((t, x) => t + Math.max(0, (x.budget ?? 0) - x.actual), 0);
      summary.push({ org, buffer, collected: b.net_income, toCollect, season: b.net_income + toCollect, spent, projExp,
        resultBudget: b.net_income + toCollect - projExp, resultNow: b.net_income + toCollect - spent, owed, feeRate });
    }
    const months = [...buckets.keys()].sort((a, c) => (a.startsWith("O") ? -1 : c.startsWith("O") ? 1 : a < c ? -1 : 1));
    const colTot = (org) => months.reduce((t, k) => t + (buckets.get(k)[org] || 0), 0);
    cur = "forecast";
    P(projectionHtml(r));
    P(`<h2>Season forecast</h2>` + (r.bank_loaded ? "" : `<div class="banner">No expenses are loaded, so the cost side of the forecast is empty.</div>`)
      + table([["Org"], ["Collected", 1], ["Still to collect", 1], ["Season income", 1], ["Spent", 1], ["Budgeted spend", 1], ["Result (spent)", 1], ["Result (budget)", 1]],
        summary.map((x) => `<tr><td>${esc(x.org)}</td><td class="n">${m(x.collected)}</td><td class="n">${m(x.toCollect)}</td><td class="n"><b>${m(x.season)}</b></td><td class="n">${m(x.spent)}</td><td class="n">${m(x.projExp)}</td><td class="n ${x.resultNow < 0 ? "bad" : ""}">${m(x.resultNow)}</td><td class="n ${x.resultBudget < 0 ? "bad" : ""}"><b>${m(x.resultBudget)}</b></td></tr>`), summary.length > 1 ? [trow(["All orgs", tsum(summary, (x) => x.collected), tsum(summary, (x) => x.toCollect), tsum(summary, (x) => x.season), tsum(summary, (x) => x.spent), tsum(summary, (x) => x.projExp), tsum(summary, (x) => x.resultNow), tsum(summary, (x) => x.resultBudget)])] : [])
      + summary.filter((x) => x.buffer > 0).map((x) => `<p class="note">${esc(x.org)} has ${m(x.buffer)} of contingency buffer. The results above don't spend it, so it is extra cushion if costs run over.</p>`).join("")
      + `<p class="note"><b>Collected</b> is net of Stripe fees so far. <b>Still to collect</b> is every unpaid installment on the player schedules (including late ones), reduced by the Stripe fee rate seen so far. Free players owe nothing. <b>Budgeted spend</b> is each category's budget (contingency lines are left out because they are padding, not planned spending), or what has already been spent if that is higher. <b>Result (spent)</b> uses what has actually been spent; <b>Result (budget)</b> assumes every budget is used. Both assume everyone pays what their plan says and no refunds.</p>`);
    if (r.bank_loaded) {
      P(whatIfPanel(r));
      P(`<h2>Budget allocations</h2>` + budgetTable(r, true)
        + `<p class="note">Type a different amount in any <b>Season budget</b> box to change that budget, or add spending line items in <b>What if I spend</b> below. Spent, Left and % used change, and so do the forecast and projection above. Nothing is <b>saved</b> and it resets when you reload. To change a budget itself, edit the <b>Budgets</b> tab of the sheet${r.sheet_url ? ` (<a href="${esc(r.sheet_url)}" target="_blank" rel="noopener">open the sheet</a>)` : ""}.${OV.size + ITEMS.length ? ` <a class="tog" id="budreset" href="#forecast">Clear ${OV.size + ITEMS.length} what-if change(s)</a>` : ""}</p>`);
    }
    // running total: what has been collected so far (gross, as in the Board summary) plus each month's expected payments
    const got = Object.fromEntries(orgs.map((o) => [o, (r.board.find((x) => x.org === o) || { gross: 0 }).gross]));
    const run = { ...got }, cum = new Map();
    for (const k of months) { for (const o of orgs) run[o] += buckets.get(k)[o] || 0; cum.set(k, { ...run }); }
    const cumTot = (c) => orgs.reduce((t, o) => t + c[o], 0), rowTot = (k) => orgs.reduce((t, o) => t + (buckets.get(k)[o] || 0), 0);
    const multi = orgs.length > 1;
    const heads = ["Month", ...orgs.map((o) => o + " expected"), "Total expected", ...(multi ? orgs.map((o) => o + " collected by then") : []), "Total collected by then"];
    const line = (k) => [k, ...orgs.map((o) => m(buckets.get(k)[o] || 0)), m(rowTot(k)), ...(multi ? orgs.map((o) => m(cum.get(k)[o])) : []), m(cumTot(cum.get(k)))];
    P(`<h2>Expected collections by month ${dl("expected_collections.csv", heads, [["Collected so far", ...orgs.map(() => ""), "", ...(multi ? orgs.map((o) => m(got[o])) : []), m(cumTot(got))], ...months.map(line)])}</h2>`
      + table([["Month"], ...orgs.map((o) => [esc(o) + " expected", 1]), ["Total expected", 1], ...(multi ? orgs.map((o) => [esc(o) + " collected by then", 1]) : []), ["Total collected by then", 1]],
        [`<tr class="tot"><td>Collected so far</td>${orgs.map(() => "<td></td>").join("")}<td></td>${multi ? orgs.map((o) => `<td class="n">${m(got[o])}</td>`).join("") : ""}<td class="n"><b>${m(cumTot(got))}</b></td></tr>`,
          ...months.map((k) => `<tr><td>${esc(k)}</td>${orgs.map((o) => `<td class="n">${m(buckets.get(k)[o] || 0)}</td>`).join("")}<td class="n">${m(rowTot(k))}</td>${multi ? orgs.map((o) => `<td class="n">${m(cum.get(k)[o])}</td>`).join("") : ""}<td class="n"><b>${m(cumTot(cum.get(k)))}</b></td></tr>`)],
        [trow(["Total", ...orgs.map((o) => colTot(o)), orgs.reduce((t, o) => t + colTot(o), 0), ...(multi ? orgs.map(() => "") : []), ""])])
      + `<p class="note">Gross amounts, before Stripe fees. <b>Collected by then</b> is what has been collected so far (the Board summary's gross income, including pending bank payments) plus everything expected up to and including that month. "Overdue / past" is money that was already due and hasn't come in; it is added to the running total in its own row, as if it all came in now. Expected totals: ${orgs.map((o) => esc(o) + " " + m(colTot(o))).join(", ")}.</p>`);
  }
  const TABS = [["overview","Overview"],["players","Players"],["income","Income"],["tx","Transactions"],["money","Budget & expenses"],["forecast","Forecast"]];
  $("#out").innerHTML = shared.join("") + `<nav id="tabs">` + TABS.map(([k, l]) => `<a href="#${k}" data-t="${k}">${l}</a>`).join("") + `</nav>`
    + TABS.map(([k]) => `<section class="pane" id="p-${k}">${T[k].join("") || '<p class="note">Nothing to show for these dates.</p>'}</section>`).join("");
  const show = () => { let h = (location.hash || "#overview").slice(1); if (!T[h]) h = "overview";
    document.querySelectorAll(".pane").forEach((e) => { e.hidden = e.id !== "p-" + h; });
    document.querySelectorAll("#tabs a").forEach((e) => e.classList.toggle("on", e.dataset.t === h)); };
  window.onhashchange = show; show();
  const filt = () => {
    const q = ($("#lq").value || "").toLowerCase(), st = $("#ls").value, gt = $("#lt").value;
    document.querySelectorAll(".lrow").forEach((row) => { row.style.display = row.dataset.n.includes(q) && (!st || row.dataset.s === st) && (!gt || row.dataset.g === gt) ? "" : "none"; });
  };
  makeSortable($("#out")); applyCaps();
  $("#lq").addEventListener("input", filt); $("#ls").addEventListener("change", filt); $("#lt").addEventListener("change", filt);
}

async function run(ev) {
  ev.preventDefault();
  const btn = $("#go"); btn.disabled = true; btn.textContent = "Loading...";
  $("#out").innerHTML = "";
  try {
    const q = new URLSearchParams({ start: $("#start").value, end: $("#end").value, org: $("#org").value });
    let pass = ""; try { pass = sessionStorage.getItem("pp") || ""; } catch (e) {}
    let res = await fetch("/api/report?" + q, { headers: { "x-passphrase": pass } });
    if (res.status === 401) {
      pass = prompt("Access passphrase:") || "";
      res = await fetch("/api/report?" + q, { headers: { "x-passphrase": pass } });
      if (res.ok) { try { sessionStorage.setItem("pp", pass); } catch (e) {} }
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    render(data);
  } catch (e) {
    $("#out").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = "Run reports"; }
}
$("#out").addEventListener("input", (e) => {
  if (e.target.id !== "projDate" || !LAST || !/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) return;
  PROJ_DATE = e.target.value; render(LAST); location.hash = "#forecast";
  const el = document.getElementById("projDate"); if (el) el.focus();
});
$("#out").addEventListener("change", (e) => {
  const t = e.target; if (!t.classList || !t.classList.contains("bud") || !LAST) return;
  const k = bkey(t.dataset.o, t.dataset.c), v = t.value.trim();
  if (v === "" || Number.isNaN(Number(v))) OV.delete(k); else OV.set(k, Number(v));
  render(LAST);
});
$("#out").addEventListener("change", (e) => {
  if (e.target.id === "wiCat") $("#wiNewWrap").hidden = e.target.value !== "__new";
});
$("#out").addEventListener("click", (e) => {
  if (e.target.classList && e.target.classList.contains("showmore")) { e.preventDefault(); const c = e.target.dataset.cid; if (EXPANDED.has(c)) EXPANDED.delete(c); else EXPANDED.add(c); applyCaps(); return; }
  if (e.target.classList && e.target.classList.contains("rmItem")) { e.preventDefault(); ITEMS = ITEMS.filter((x) => String(x.id) !== e.target.dataset.id); render(LAST); location.hash = "#forecast"; return; }
  if (e.target.id === "wiAdd") {
    const amount = Math.round(Number($("#wiAmt").value) * 100) / 100, desc = $("#wiDesc").value.trim() || "What-if expense";
    let org, category; const v = $("#wiCat").value;
    if (v === "__new") { org = $("#wiNewOrg").value; category = $("#wiNewCat").value.trim(); } else { const k = (LAST_CATS || [])[Number(v)] || ""; [org, category] = k.split("\u0000"); }
    if (!(amount > 0) || !category) { $("#wiAmt").focus(); return; }
    ITEMS.push({ id: ++ITEM_ID, org, category, desc, amount }); render(LAST); location.hash = "#forecast"; return;
  }
  if (e.target.id === "budreset" || e.target.id === "budreset2") { e.preventDefault(); OV.clear(); ITEMS = []; render(LAST); }
});
$("#f").addEventListener("submit", run);
$("#f").requestSubmit();
</script>
</main></body></html>
